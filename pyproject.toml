[tool.poetry]
name = "elevate-python"
version = "0.1.0"
description = "A Python-based client for Elevate, a sports activity tracking and analysis application."
authors = ["Jules"]
packages = [{include = "elevate"}]

[tool.poetry.dependencies]
python = "^3.9"
PyQt6 = "^6.4.2"
SQLAlchemy = "^2.0.7"
pytest = "^7.2.2"
requests = "^2.28.2"
keyring = "^24.2.0"
keyrings-cryptfile = "^1.3.9"

[tool.poetry.dev-dependencies]
pytest-cov = "^4.0.0"
pytest-mock = "^3.10.0"
requests-mock = "^1.9.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
